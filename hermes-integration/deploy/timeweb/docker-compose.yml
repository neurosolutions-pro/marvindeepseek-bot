services:
  hermes:
    build:
      context: ../..
      dockerfile: deploy/timeweb/Dockerfile
    container_name: hermes
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HERMES_HOST: 0.0.0.0
      HERMES_PORT: 8000
      # Upstream is an external OpenAI-compatible API (DeepSeek), not a local model.
      HERMES_UPSTREAM_BASE_URL: ${HERMES_UPSTREAM_BASE_URL}
      HERMES_UPSTREAM_API_KEY: ${HERMES_UPSTREAM_API_KEY}
      HERMES_MODEL: ${HERMES_MODEL:-deepseek-chat}
      HERMES_LOG_LEVEL: ${HERMES_LOG_LEVEL:-info}
    ports:
      # Bind to localhost only — clients on the host / other containers use Docker network.
      - "127.0.0.1:8000:8000"
    mem_limit: 256m
    cpus: "0.50"
    networks:
      - default
      - agent-shared
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  agent-shared:
    external: true
